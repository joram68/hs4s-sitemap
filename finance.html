<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Finance</title>

<style>

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
    padding: 16px;
}

.finance-box {
    max-width: 850px;
    margin-left: 30px;
}

h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

h3 {
    font-size: 16px;
    margin-top: 20px;
}


input, select {

    padding: 8px;

    border: 1.5px solid rgba(120,120,120,0.8);

    border-radius: 4px;

    background: transparent;

    color: inherit;

    font-family: Georgia, serif;

}


button {

    padding: 8px 14px;

    border: 1.5px solid rgba(120,120,120,0.8);

    border-radius: 4px;

    background: transparent;

    color: inherit;

    cursor: pointer;

    font-family: Georgia, serif;

}


button:hover {

    opacity: 0.7;

}


.saldo-box {

    border-bottom: 1px solid rgba(120,120,120,0.4);

    padding: 10px 0;

    margin-bottom: 15px;

}


table {

    width: 100%;

    border-collapse: collapse;

}


th {

    text-align: left;

    border-bottom: 2px solid rgba(120,120,120,0.5);

    padding: 8px;

}


td {

    padding: 8px;

    border-bottom: 1px solid rgba(120,120,120,0.3);

}


.verwijder {

    cursor:pointer;

    border:1px solid rgba(120,120,120,0.8);

    padding:3px 7px;

    border-radius:4px;

}


.totaal {

    margin-top:20px;

    border-top:1px solid rgba(120,120,120,0.5);

    padding-top:10px;

    font-size:16px;

}


</style>

</head>


<body>


<div class="finance-box">


<h2>💰 HS4S Finance</h2>


<div class="saldo-box">

<label>Beginsaldo:</label>

<input id="beginSaldo" type="number" step="0.01">

<button onclick="bewaarSaldo()">Opslaan</button>

<br><br>

<b>Huidig saldo:</b>

€ <span id="saldo">0.00</span>

</div>


<h3>Nieuwe transactie</h3>


<input id="datum" type="date">


<input id="omschrijving" placeholder="Omschrijving">


<select id="categorie">

<option>Wonen</option>
<option>Voeding</option>
<option>Auto</option>
<option>Hobby</option>
<option>Reizen</option>
<option>Gezondheid</option>
<option>Diversen</option>

</select>


<input id="inkomst" type="number" placeholder="Inkomst">


<input id="uitgave" type="number" placeholder="Uitgave">


<button onclick="toevoegen()">+</button>


<table>

<thead>

<tr>

<th>Datum</th>
<th>Omschrijving</th>
<th>Categorie</th>
<th>In</th>
<th>Uit</th>
<th>Saldo</th>
<th></th>

</tr>

</thead>


<tbody id="lijst">

</tbody>


</table>


<div class="totaal">

<b>Totaal inkomsten:</b>
€ <span id="totaalIn">0.00</span>
<br>

<b>Totaal uitgaven:</b>
€ <span id="totaalUit">0.00</span>

</div>
    <script>

let transacties = JSON.parse(
    localStorage.getItem("HS4S_finance")
) || [];

let beginsaldo = 
    parseFloat(localStorage.getItem("HS4S_beginsaldo")) || 0;


// Beginsaldo tonen

document.getElementById("beginSaldo").value = beginsaldo;



function bewaarSaldo(){

    beginsaldo = parseFloat(
        document.getElementById("beginSaldo").value
    ) || 0;

    localStorage.setItem(
        "HS4S_beginsaldo",
        beginsaldo
    );

    tonen();

}



// Nieuwe transactie toevoegen

function toevoegen(){

    let item = {

        datum:
        document.getElementById("datum").value,

        omschrijving:
        document.getElementById("omschrijving").value,

        categorie:
        document.getElementById("categorie").value,

        inkomst:
        parseFloat(document.getElementById("inkomst").value) || 0,

        uitgave:
        parseFloat(document.getElementById("uitgave").value) || 0

    };


    if(item.omschrijving === ""){

        alert("Vul een omschrijving in");

        return;

    }


    transacties.push(item);


    localStorage.setItem(
        "HS4S_finance",
        JSON.stringify(transacties)
    );


    document.getElementById("omschrijving").value="";
    document.getElementById("inkomst").value="";
    document.getElementById("uitgave").value="";


    tonen();

}



// Alles tonen

function tonen(){

    let lijst = document.getElementById("lijst");

    lijst.innerHTML="";


    let saldo = beginsaldo;

    let totaalIn = 0;
    let totaalUit = 0;



    transacties.forEach(function(t,index){


        saldo += t.inkomst;
        saldo -= t.uitgave;


        totaalIn += t.inkomst;
        totaalUit += t.uitgave;



        let rij = document.createElement("tr");


        rij.innerHTML = `

        <td>${t.datum}</td>

        <td>${t.omschrijving}</td>

        <td>${t.categorie}</td>

        <td>€ ${t.inkomst.toFixed(2)}</td>

        <td>€ ${t.uitgave.toFixed(2)}</td>

        <td>€ ${saldo.toFixed(2)}</td>

        <td>
        <span class="verwijder" onclick="wissen(${index})">
        🗑
        </span>
        </td>

        `;


        lijst.appendChild(rij);


    });



    document.getElementById("saldo").innerHTML =
    saldo.toFixed(2);


    document.getElementById("totaalIn").innerHTML =
    totaalIn.toFixed(2);


    document.getElementById("totaalUit").innerHTML =
    totaalUit.toFixed(2);


}



// Verwijderen

function wissen(index){


    transacties.splice(index,1);


    localStorage.setItem(
        "HS4S_finance",
        JSON.stringify(transacties)
    );


    tonen();


}



// Start

tonen();


</script>


</div>

</body>
</html>
