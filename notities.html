
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
}

.notitie-box {
    width: 100%;
    max-width: 400px;
    margin: 0;
    padding: 10px 20px;
}

h2 {
    margin: 0 0 35px 0;
    font-size: 18px;
    font-weight: bold;
}

.invoer-regel {
    display: flex;
    width: 100%;
    gap: 5px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border-radius: 4px;
    border: 1.9px solid rgba(120,120,120,1);
    background: transparent;
    color: inherit;
    outline: none;
}

input::placeholder {
    opacity: 0.6;
}

/* + knop MET kader */
button.toevoegen-knop {
    padding: 10px 14px;
    border: 1.9px solid rgba(120,120,120,1);
    border-radius: 4px;
    background: transparent;
    color: inherit;
    cursor: pointer;
}

ul {
    padding: 0;
    margin: 12px 0 0 0;
    width: 100%;
}

li {
    list-style: none;
    padding: 4px 0;
    margin: 0;
    border-bottom: 1px solid rgba(120,120,120,0.35);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-height: 28px;
}

.notitie-tekst {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

/* Prullenmand ZONDER kader */
button.verwijder {
    appearance: none;
    -webkit-appearance: none;
    border: 0 !important;
    outline: 0;
    box-shadow: none !important;
    background: transparent !important;
    border-radius: 0;
    padding: 2px 0;
    margin: 0;
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    color: inherit;
    cursor: pointer;
    flex-shrink: 0;
}

button.verwijder:hover {
    opacity: 0.6;
}

button.verwijder:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
}

</style>
</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<div class="invoer-regel">

<input
    id="tekst"
    placeholder="Nieuwe notitie..."
    onkeydown="enterToevoegen(event)"
>

<button
    type="button"
    class="toevoegen-knop"
    onclick="toevoegen()">+</button>

</div>

<ul id="lijst"></ul>

</div>

<script>

let notities = JSON.parse(
    localStorage.getItem("HS4S_notities")
) || [];

function opslaan() {

    localStorage.setItem(
        "HS4S_notities",
        JSON.stringify(notities)
    );

}

function tonen() {

    let lijst = document.getElementById("lijst");

    lijst.innerHTML = "";

    notities.forEach(function(item, index) {

        let li = document.createElement("li");

        let tekst = document.createElement("span");
        tekst.className = "notitie-tekst";
        tekst.textContent = item;

        let verwijder = document.createElement("button");
        verwijder.className = "verwijder";
        verwijder.type = "button";
        verwijder.textContent = "🗑";
        verwijder.setAttribute(
            "aria-label",
            "Notitie verwijderen"
        );

        verwijder.onclick = function() {
            wissen(index);
        };

        li.appendChild(tekst);
        li.appendChild(verwijder);

        lijst.appendChild(li);

    });

}

function toevoegen() {

    let veld = document.getElementById("tekst");

    if (veld.value.trim() !== "") {

        notities.push(veld.value);

        opslaan();

        veld.value = "";

        tonen();

        veld.focus();

    }

}

function enterToevoegen(event) {

    if (event.key === "Enter") {
        toevoegen();
    }

}

function wissen(index) {

    notities.splice(index, 1);

    opslaan();

    tonen();

}

tonen();

</script>

</body>
</html>
