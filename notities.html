<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
    padding: 16px;
}

.notitie-box {
    max-width: 400px;
    margin-left: 55px;
}

h2 {
    margin: 0 0 20px 0;
    font-size: 18px;
    font-weight: bold;
}

input {
    width: 75%;
    padding: 10px;
    border-radius: 4px;
    border: 1.9px solid rgba(120,120,120,1);
    background: transparent;
    color: inherit;
    outline: none;
}

input::placeholder {
    opacity: 0.6;
}

button {
    padding: 10px 14px;
    border-radius: 4px;
    border: 1.9px solid rgba(120,120,120,1);
    background: transparent;
    color: inherit;
    cursor: pointer;
}

ul {
    padding: 0;
    margin-top: 15px;
}

li {
    list-style: none;
    padding: 9px 0;
    margin-bottom: 5px;
    border-bottom: 1px solid rgba(120,120,120,0.35);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.verwijder {
    cursor: pointer;
    border: 1.5px solid rgba(120,120,120,1);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 16px;
}

</style>

</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<input 
id="tekst"
placeholder="Nieuwe notitie..."
onkeydown="enterToevoegen(event)"
>

<button onclick="toevoegen()">+</button>

<ul id="lijst"></ul>

</div>


<script>

let notities = JSON.parse(
    localStorage.getItem("HS4S_notities")
) || [];


function opslaan(){

    localStorage.setItem(
        "HS4S_notities",
        JSON.stringify(notities)
    );

}


function tonen(){

    let lijst = document.getElementById("lijst");

    lijst.innerHTML = "";

    notities.forEach(function(item,index){

        let li = document.createElement("li");

        li.innerHTML = `
        <span>${item}</span>
        <span class="verwijder" onclick="wissen(${index})">
        🗑
        </span>
        `;

        lijst.appendChild(li);

    });

}


function toevoegen(){

    let veld = document.getElementById("tekst");

    if(veld.value.trim() !== ""){

        notities.push(veld.value);

        opslaan();

        veld.value = "";

        tonen();

    }

}


function enterToevoegen(event){

    if(event.key === "Enter"){

        toevoegen();

    }

}


function wissen(index){

    notities.splice(index,1);

    opslaan();

    tonen();

}


tonen();

</script>

</body>
</html>
