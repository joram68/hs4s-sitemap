
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: transparent;
    color: #333333;
}

/* Buitenste witte kaart */

.notitie-box {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 32px 36px 36px;
    background: #ffffff;
    border: 2px solid #dddddd;
    border-radius: 24px;
}

/* Titel */

h2 {
    margin: 0 0 30px 0;
    font-size: 30px;
    font-weight: bold;
    color: #333333;
}

/* Invoerregel */

.invoer-regel {
    display: flex;
    align-items: stretch;
    width: 100%;
    gap: 8px;
}

#tekst {
    flex: 1;
    width: 100%;
    min-width: 0;
    padding: 13px 15px;
    border: 1px solid #cccccc;
    border-radius: 8px;
    background: #ffffff;
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 17px;
    outline: none;
}

#tekst:focus {
    border-color: #999999;
}

#tekst::placeholder {
    color: #888888;
}

/* Toevoegen en opslaan */

#plus-knop {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    background: #939393;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-family: Arial, sans-serif;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s;
}

#plus-knop:hover {
    background: #636363;
}

/* Annuleren */

#annuleer-knop {
    display: none;
    background: #777777;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 18px;
}

#annuleer-knop:hover {
    background: #555555;
}

/* Notitielijst */

ul {
    padding: 0;
    margin: 22px 0 0 0;
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* Notitiekaart aangepast aan tekst */

li {
    list-style: none;

    width: fit-content;
    max-width: 100%;

    padding: 16px 20px;
    margin: 0 0 12px 0;

    background: #f1f1f1;
    border: none;
    border-left: 9px solid #aaaaaa;
    border-radius: 16px;

    display: inline-flex;
    justify-content: flex-start;
    align-items: center;
    gap: 18px;

    min-height: 65px;
}

/* Notitietekst */

.notitie-tekst {
    flex: 0 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 19px;
    line-height: 1.5;
    color: #333333;
}

/* Actieknoppen */

.notitie-acties {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.bewerken,
.verwijder {
    display: inline-block;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 4px;
    margin: 0;
    font-size: 21px;
    line-height: 1;
}

.bewerken:hover,
.verwijder:hover {
    opacity: 0.55;
}

/* Smartphone */

@media (max-width: 600px) {

    .notitie-box {
        padding: 20px 16px 22px;
        border-radius: 18px;
    }

    h2 {
        font-size: 23px;
        margin-bottom: 22px;
    }

    li {
        padding: 13px 14px;
        border-left-width: 7px;
        border-radius: 13px;
        min-height: 55px;
        gap: 10px;
    }

    .notitie-tekst {
        font-size: 17px;
    }

    .notitie-acties {
        gap: 8px;
    }

    .bewerken,
    .verwijder {
        font-size: 19px;
    }

    #tekst {
        font-size: 15px;
    }

    #plus-knop {
        padding: 8px 15px;
    }
}

</style>
</head>

<body>

<div class="notitie-box">

    <h2>📝 HS4S – Snelle notitie</h2>

    <div class="invoer-regel">

        <input
            id="tekst"
            placeholder="Nieuwe notitie..."
        >

        <button id="plus-knop" type="button">+</button>

        <button id="annuleer-knop" type="button">✕</button>

    </div>

    <ul id="lijst"></ul>

</div>

<script>

(function() {

    let notities = [];
    let bewerkIndex = null;

    const f = document.getElementById("tekst");
    const plus = document.getElementById("plus-knop");
    const annuleer = document.getElementById("annuleer-knop");
    const lijst = document.getElementById("lijst");

    // Bestaande notities ophalen

    try {
        notities = JSON.parse(
            localStorage.getItem("HS4S_notities") || "[]"
        );

        if (!Array.isArray(notities)) {
            notities = [];
        }

    } catch (e) {
        notities = [];
    }

    // Opslaan

    function opslaan() {

        localStorage.setItem(
            "HS4S_notities",
            JSON.stringify(notities)
        );

    }

    // Notities tonen

    function tonen() {

        lijst.innerHTML = "";

        notities.forEach(function(item, index) {

            const li = document.createElement("li");

            const tekst = document.createElement("span");
            tekst.className = "notitie-tekst";
            tekst.textContent = item;

            const acties = document.createElement("div");
            acties.className = "notitie-acties";

            // Bewerken

            const bewerken = document.createElement("button");

            bewerken.type = "button";
            bewerken.className = "bewerken";
            bewerken.textContent = "✏️";
            bewerken.title = "Notitie bewerken";

            bewerken.addEventListener("click", function() {
                startBewerken(index);
            });

            // Verwijderen

            const verwijderen = document.createElement("button");

            verwijderen.type = "button";
            verwijderen.className = "verwijder";
            verwijderen.textContent = "🗑";
            verwijderen.title = "Notitie verwijderen";

            verwijderen.addEventListener("click", function() {
                wissen(index);
            });

            acties.appendChild(bewerken);
            acties.appendChild(verwijderen);

            li.appendChild(tekst);
            li.appendChild(acties);

            lijst.appendChild(li);

        });

    }

    // Nieuwe notitie of bestaande notitie opslaan

    function toevoegen() {

        const nieuweTekst = f.value.trim();

        if (!nieuweTekst) {
            f.focus();
            return;
        }

        if (bewerkIndex !== null) {

            notities[bewerkIndex] = nieuweTekst;

        } else {

            notities.push(nieuweTekst);

        }

        opslaan();

        f.value = "";

        stopBewerken();

        tonen();

        f.focus();

    }

    // Bewerken starten

    function startBewerken(index) {

        bewerkIndex = index;

        f.value = notities[index];
        f.placeholder = "Notitie bewerken...";

        plus.textContent = "✓";
        annuleer.style.display = "block";

        f.focus();

    }

    // Bewerken annuleren

    function annuleerBewerken() {

        f.value = "";

        stopBewerken();

        f.focus();

    }

    // Bewerken afsluiten

    function stopBewerken() {

        bewerkIndex = null;

        f.placeholder = "Nieuwe notitie...";

        plus.textContent = "+";

        annuleer.style.display = "none";

    }

    // Notitie verwijderen

    function wissen(index) {

        notities.splice(index, 1);

        if (bewerkIndex === index) {

            f.value = "";
            stopBewerken();

        } else if (bewerkIndex !== null && index < bewerkIndex) {

            bewerkIndex--;

        }

        opslaan();

        tonen();

    }

    // Knoppen koppelen

    plus.addEventListener("click", toevoegen);

    annuleer.addEventListener("click", annuleerBewerken);

    f.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            toevoegen();
        }

        if (event.key === "Escape" && bewerkIndex !== null) {
            annuleerBewerken();
        }

    });

    // Starten

    tonen();

})();

</script>

</body>
</html>
