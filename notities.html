
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
}

.notitie-box {
    width: 100%;
    max-width: 400px;
    margin: 0;
    padding: 10px 20px;
}

h2 {
    margin: 0 0 35px 0;
    font-size: 18px;
    font-weight: bold;
}

.invoer-regel {
    display: flex;
    align-items: stretch;
    width: 100%;
    gap: 5px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border: 1.9px solid #787878;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    outline: none;
    font-family: inherit;
}

input::placeholder {
    opacity: 0.6;
}

/* PLUSKNOP - MET ZICHTBAAR KADER */
#plus-knop {
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 42px;
    padding: 10px;
    border: 1.9px solid #787878 !important;
    border-radius: 4px !important;
    background: transparent !important;
    color: inherit;
    font-family: Georgia, serif;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
}

ul {
    padding: 0;
    margin: 12px 0 0 0;
    width: 100%;
}

li {
    list-style: none;
    padding: 4px 0;
    margin: 0;
    border-bottom: 1px solid rgba(120,120,120,0.35);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-height: 28px;
}

.notitie-tekst {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

/* PRULLENMAND - ZONDER KADER */
.verwijder {
    display: inline-block;
    flex-shrink: 0;
    cursor: pointer;
    border: none !important;
    outline: none;
    box-shadow: none !important;
    background: transparent !important;
    padding: 2px 0;
    margin: 0;
    font-size: 16px;
    line-height: 1;
}

.verwijder:hover {
    opacity: 0.6;
}

.verwijder:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
}

</style>
</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<div class="invoer-regel">

<input
    id="tekst"
    placeholder="Nieuwe notitie..."
    onkeydown="enterToevoegen(event)"
>

<button
    id="plus-knop"
    type="button"
    onclick="toevoegen()">+</button>

</div>

<ul id="lijst"></ul>

</div>

<script>

let notities = JSON.parse(
    localStorage.getItem("HS4S_notities")
) || [];

function opslaan() {
    localStorage.setItem(
        "HS4S_notities",
        JSON.stringify(notities)
    );
}

function tonen() {

    let lijst = document.getElementById("lijst");
    lijst.innerHTML = "";

    notities.forEach(function(item, index) {

        let li = document.createElement("li");

        let tekst = document.createElement("span");
        tekst.className = "notitie-tekst";
        tekst.textContent = item;

        let verwijder = document.createElement("span");
        verwijder.className = "verwijder";
        verwijder.textContent = "🗑";
        verwijder.setAttribute("role", "button");
        verwijder.setAttribute("tabindex", "0");
        verwijder.setAttribute(
            "aria-label", "Notitie verwijderen"
        );

        verwijder.onclick = function() {
            wissen(index);
        };

        verwijder.onkeydown = function(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                wissen(index);
            }
        };

        li.appendChild(tekst);
        li.appendChild(verwijder);

        lijst.appendChild(li);
    });
}

function toevoegen() {

    let veld = document.getElementById("tekst");

    if (veld.value.trim() !== "") {

        notities.push(veld.value);
        opslaan();

        veld.value = "";
        tonen();
        veld.focus();
    }
}

function enterToevoegen(event) {
    if (event.key === "Enter") {
        toevoegen();
    }
}

function wissen(index) {
    notities.splice(index, 1);
    opslaan();
    tonen();
}

tonen();

</script>

</body>
</html>
