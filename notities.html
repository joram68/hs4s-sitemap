<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
}

.notitie-box {
    width: 100%;
    max-width: 450px;
    margin: 5;
    padding: 20px 40px;
}

h2 {
    margin: 0 0 20px 0;
    font-size: 18px;
    font-weight: bold;
}

.invoer-regel {
    display: flex;
    width: 100%;
    gap: 5px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border-radius: 4px;
    border: 1.9px solid rgba(120,120,120,1);
    background: transparent;
    color: inherit;
    outline: none;
}

input::placeholder {
    opacity: 0.6;
}

button {
    padding: 10px 14px;
    border-radius: 0px;
    border: 0px solid rgba(120,120,120,1);
    background: transparent;
    color: inherit;
    cursor: pointer;
}

ul {
    padding: 0;
    margin: 15px 0 0 0;
    width: 100%;
}

li {
    list-style: none;
    padding: 9px 0;
    margin-bottom: 5px;
    border-bottom: 1px solid rgba(120,120,120,0.35);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.notitie-tekst {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
}

.verwijder {
    cursor: pointer;
    border: 1.5px solid rgba(120,120,120,1);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 16px;
    flex-shrink: 0;
}

</style>
</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<div class="invoer-regel">

<input
    id="tekst"
    placeholder="Nieuwe notitie..."
    onkeydown="enterToevoegen(event)"
>

<button onclick="toevoegen()">+</button>

</div>

<ul id="lijst"></ul>

</div>

<script>

let notities = JSON.parse(
    localStorage.getItem("HS4S_notities")
) || [];

function opslaan() {

    localStorage.setItem(
        "HS4S_notities",
        JSON.stringify(notities)
    );

}

function tonen() {

    let lijst = document.getElementById("lijst");

    lijst.innerHTML = "";

    notities.forEach(function(item, index) {

        let li = document.createElement("li");

        let tekst = document.createElement("span");
        tekst.className = "notitie-tekst";
        tekst.textContent = item;

        let verwijder = document.createElement("span");
        verwijder.className = "verwijder";
        verwijder.textContent = "🗑";

        verwijder.onclick = function() {
            wissen(index);
        };

        li.appendChild(tekst);
        li.appendChild(verwijder);

        lijst.appendChild(li);

    });

}

function toevoegen() {

    let veld = document.getElementById("tekst");

    if (veld.value.trim() !== "") {

        notities.push(veld.value);

        opslaan();

        veld.value = "";

        tonen();

        veld.focus();

    }

}

function enterToevoegen(event) {

    if (event.key === "Enter") {
        toevoegen();
    }

}

function wissen(index) {

    notities.splice(index, 1);

    opslaan();

    tonen();

}

tonen();

</script>

</body>
</html>
