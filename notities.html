
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
}

.notitie-box {
    width: 100%;
    max-width: 480px;
    margin: 0;
    padding: 10px 20px;
}

h2 {
    margin: 0 0 35px 0;
    font-size: 18px;
    font-weight: bold;
}

/* Invoerregel */

.invoer-regel {
    display: flex;
    align-items: stretch;
    width: 100%;
    gap: 6px;
}

#tekst {
    flex: 1;
    width: 100%;
    min-width: 0;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #ffffff;
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 13px;
    outline: none;
}

#tekst::placeholder {
    color: #777777;
    opacity: 1;
}

/* Plus- en opslaanknop */

#plus-knop {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    background: #939393;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}

#plus-knop:hover {
    background: #636363;
}

/* Annuleerknop */

#annuleer-knop {
    display: none;
    background: #777777;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
}

#annuleer-knop:hover {
    background: #555555;
}

/* Notitielijst */

ul {
    padding: 0;
    margin: 14px 0 0 0;
    width: 100%;
}

li {
    list-style: none;
    width: 100%;
    padding: 10px 12px;
    margin: 0 0 9px 0;

    background: rgba(147,147,147,0.12);
    border: 1px solid rgba(147,147,147,0.40);
    border-radius: 6px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;

    min-height: 42px;
}

.notitie-tekst {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 14px;
    line-height: 1.5;
}

/* Knoppen rechts */

.notitie-acties {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.bewerken,
.verwijder {
    display: inline-block;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 17px;
    line-height: 1;
}

.bewerken:hover,
.verwijder:hover {
    opacity: 0.6;
}

.bewerken:focus-visible,
.verwijder:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
}

</style>
</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<div class="invoer-regel">

<input
    id="tekst"
    placeholder="Nieuwe notitie..."
    onkeydown="enterToevoegen(event)"
>

<button
    id="plus-knop"
    type="button"
    onclick="toevoegen()">+</button>

<button
    id="annuleer-knop"
    type="button"
    onclick="annuleerBewerken()">✕</button>

</div>

<ul id="lijst"></ul>

</div>

<script>

let notities = JSON.parse(
    localStorage.getItem("HS4S_notities")
) || [];

let bewerkIndex = null;

/* Opslaan */

function opslaan() {
    localStorage.setItem(
        "HS4S_notities",
        JSON.stringify(notities)
    );
}

/* Notities tonen */

function tonen() {

    let lijst = document.getElementById("lijst");
    lijst.innerHTML = "";

    notities.forEach(function(item, index) {

        let li = document.createElement("li");

        let tekst = document.createElement("span");
        tekst.className = "notitie-tekst";
        tekst.textContent = item;

        // Knoppen samenvoegen

        let acties = document.createElement("div");
        acties.className = "notitie-acties";

        // Bewerken

        let bewerken = document.createElement("button");
        bewerken.className = "bewerken";
        bewerken.type = "button";
        bewerken.textContent = "✏️";
        bewerken.setAttribute("aria-label", "Notitie bewerken");

        bewerken.onclick = function() {
            startBewerken(index);
        };

        // Verwijderen

        let verwijder = document.createElement("button");
        verwijder.className = "verwijder";
        verwijder.type = "button";
        verwijder.textContent = "🗑";
        verwijder.setAttribute("aria-label", "Notitie verwijderen");

        verwijder.onclick = function() {
            wissen(index);
        };

        acties.appendChild(bewerken);
        acties.appendChild(verwijder);

        li.appendChild(tekst);
        li.appendChild(acties);

        lijst.appendChild(li);
    });
}

/* Nieuwe notitie toevoegen of bewerken opslaan */

function toevoegen() {

    let veld = document.getElementById("tekst");
    let nieuweTekst = veld.value.trim();

    if (nieuweTekst === "") {
        return;
    }

    if (bewerkIndex !== null) {

        // Bestaande notitie aanpassen
        notities[bewerKIndex()] = nieuweTekst;

    } else {

        // Nieuwe notitie toevoegen
        notities.push(nieuweTekst);

    }

    opslaan();

    veld.value = "";
    stopBewerken();
    tonen();

    veld.focus();
}

/* Bewerken starten */

function startBewerken(index) {

    let veld = document.getElementById("tekst");

    bewerkIndex = index;

    veld.value = notities[index];
    veld.placeholder = "Notitie bewerken...";

    document.getElementById("plus-knop").textContent = "✓";
    document.getElementById("annuleer-knop").style.display = "block";

    veld.focus();
}

/* Bewerken annuleren */

function annuleerBewerken() {

    document.getElementById("tekst").value = "";

    stopBewerken();

}

/* Bewerken afsluiten */

function stopBewerken() {

    bewerkIndex = null;

    document.getElementById("tekst").placeholder = "Nieuwe notitie...";
    document.getElementById("plus-knop").textContent = "+";
    document.getElementById("annuleer-knop").style.display = "none";

}

function bewerKIndex() {
    return bewerkIndex;
}

/* Enter gebruiken */

function enterToevoegen(event) {

    if (event.key === "Enter") {
        event.preventDefault();
        toevoegen();
    }
}

/* Notitie verwijderen */

function wissen(index) {

    notities.splice(index, 1);

    if (bewerkIndex === index) {
        document.getElementById("tekst").value = "";
        stopBewerken();
    } else if (bewerkIndex !== null && index < bewerkIndex) {
        bewerkIndex--;
    }

    opslaan();
    tonen();
}

/* Starten */

tonen();

</script>

</body>
</html>
