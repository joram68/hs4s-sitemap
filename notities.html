
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Snelle Notitie</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
}

.notitie-box {
    width: 100%;
    max-width: 480px;
    margin: 0;
    padding: 10px 20px;
}

h2 {
    margin: 0 0 35px 0;
    font-size: 18px;
    font-weight: bold;
}

/* Invoerregel */

.invoer-regel {
    display: flex;
    align-items: stretch;
    width: 100%;
    gap: 6px;
}

#tekst {
    flex: 1;
    width: 100%;
    min-width: 0;
    padding: 8px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #ffffff;
    color: #333333;
    font-family: Arial, sans-serif;
    font-size: 13px;
    outline: none;
}

#tekst::placeholder {
    color: #777777;
    opacity: 1;
}

/* Plus- en opslaanknop */

#plus-knop {
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
    background: #939393;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}

#plus-knop:hover {
    background: #636363;
}

/* Annuleerknop */

#annuleer-knop {
    display: none;
    background: #777777;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
}

#annuleer-knop:hover {
    background: #555555;
}

/* Notitielijst */

ul {
    padding: 0;
    margin: 14px 0 0 0;
    width: 100%;
}

/* Witte vakjes voor de notities */

li {
    list-style: none;
    width: 100%;
    padding: 10px 12px;
    margin: 0 0 9px 0;

    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 6px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;

    min-height: 42px;
}

.notitie-tekst {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 14px;
    line-height: 1.5;
}

/* Knoppen rechts */

.notitie-acties {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.bewerken,
.verwijder {
    display: inline-block;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 2px;
    margin: 0;
    font-size: 17px;
    line-height: 1;
}

.bewerken:hover,
.verwijder:hover {
    opacity: 0.6;
}

</style>
</head>

<body>

<div class="notitie-box">

<h2>📝 Snelle notitie</h2>

<div class="invoer-regel">

<input
    id="tekst"
    placeholder="Nieuwe notitie..."
>

<button id="plus-knop" type="button">+</button>

<button id="annuleer-knop" type="button">✕</button>

</div>

<ul id="lijst"></ul>

</div>

<script>

(function() {

    let notities = [];

    let bewerkIndex = null;

    const f = document.getElementById("tekst");
    const plus = document.getElementById("plus-knop");
    const annuleer = document.getElementById("annuleer-knop");
    const lijst = document.getElementById("lijst");

    // Bestaande notities ophalen

    try {
        notities = JSON.parse(
            localStorage.getItem("HS4S_notities") || "[]"
        );

        if (!Array.isArray(notities)) {
            notities = [];
        }
    } catch (e) {
        notities = [];
    }

    // Opslaan

    function opslaan() {
        localStorage.setItem(
            "HS4S_notities",
            JSON.stringify(notities)
        );
    }

    // Notities tonen

    function tonen() {

        lijst.innerHTML = "";

        notities.forEach(function(item, index) {

            const li = document.createElement("li");

            const tekst = document.createElement("span");
            tekst.className = "notitie-tekst";
            tekst.textContent = item;

            const acties = document.createElement("div");
            acties.className = "notitie-acties";

            // Bewerken

            const bewerken = document.createElement("button");
            bewerken.type = "button";
            bewerken.className = "bewerken";
            bewerken.textContent = "✏️";
            bewerken.title = "Notitie bewerken";

            bewerken.addEventListener("click", function() {
                startBewerken(index);
            });

            // Verwijderen

            const verwijderen = document.createElement("button");
            verwijderen.type = "button";
            verwijderen.className = "verwijder";
            verwijderen.textContent = "🗑";
            verwijderen.title = "Notitie verwijderen";

            verwijderen.addEventListener("click", function() {
                wissen(index);
            });

            acties.appendChild(bewerken);
            acties.appendChild(verwijderen);

            li.appendChild(tekst);
            li.appendChild(acties);

            lijst.appendChild(li);

        });
    }

    // Nieuwe notitie of bestaande notitie opslaan

    function toevoegen() {

        const nieuweTekst = f.value.trim();

        if (!nieuweTekst) {
            f.focus();
            return;
        }

        if (bewerkIndex !== null) {

            notities[bewerkIndex] = nieuweTekst;

        } else {

            notities.push(nieuweTekst);

        }

        opslaan();

        f.value = "";

        stopBewerken();

        tonen();

        f.focus();
    }

    // Bewerken starten

    function startBewerken(index) {

        bewerkIndex = index;

        f.value = notities[index];
        f.placeholder = "Notitie bewerken...";

        plus.textContent = "✓";
        annuleer.style.display = "block";

        f.focus();
    }

    // Bewerken annuleren

    function annuleerBewerken() {

        f.value = "";

        stopBewerken();

        f.focus();
    }

    // Bewerken afsluiten

    function stopBewerken() {

        bewerkIndex = null;

        f.placeholder = "Nieuwe notitie...";

        plus.textContent = "+";

        annuleer.style.display = "none";
    }

    // Notitie verwijderen

    function wissen(index) {

        notities.splice(index, 1);

        if (bewerkIndex === index) {

            f.value = "";
            stopBewerken();

        } else if (bewerkIndex !== null && index < bewerkIndex) {

            bewerkIndex--;

        }

        opslaan();

        tonen();
    }

    // Knoppen koppelen

    plus.addEventListener("click", toevoegen);

    annuleer.addEventListener("click", annuleerBewerken);

    f.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            toevoegen();
        }

        if (event.key === "Escape" && bewerkIndex !== null) {
            annuleerBewerken();
        }

    });

    // Starten

    tonen();

})();

</script>

</body>
</html>
