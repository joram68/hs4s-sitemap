<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Financieel</title>

<style>

body{
    margin:0;
    padding:30px;
    font-family:Georgia,serif;
    background:transparent;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    margin:0 0 25px 0;
    font-size:30px;
    font-weight:normal;
}

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{

    border:1.6px solid rgba(120,120,120,.7);

    border-radius:6px;

    padding:18px;

    background:transparent;

}

.card h3{

    margin:0;

    font-size:15px;

    font-weight:normal;

    opacity:.75;

}

.bedrag{

    margin-top:12px;

    font-size:30px;

}

.maanden{

    margin-top:35px;

}

.maanden h2{

    margin-bottom:15px;

    font-size:22px;

    font-weight:normal;

}

.grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.maand{

    border:1.5px solid rgba(120,120,120,.7);

    border-radius:6px;

    padding:15px;

    cursor:pointer;

    transition:.2s;

}

.maand:hover{

    background:rgba(120,120,120,.08);

}

.footer{

    margin-top:40px;

    display:flex;

    gap:15px;

}

button{

    padding:10px 18px;

    border:1.5px solid rgba(120,120,120,.7);

    border-radius:5px;

    background:transparent;

    cursor:pointer;

    font-family:Georgia,serif;

}

button:hover{

    background:rgba(120,120,120,.08);

}

</style>

</head>

<body>

<div class="container">

<h1>💰 HS4S Financieel</h1>

<div class="top">

<div class="card">
<h3>💳 Rekeningsaldo</h3>
<div class="bedrag">€ 0,00</div>
</div>

<div class="card">
<h3>🏦 Spaargeld</h3>
<div class="bedrag">€ 0,00</div>
</div>

<div class="card">
<h3>📌 Nog te betalen</h3>
<div class="bedrag">€ 0,00</div>
</div>

<div class="card">
<h3>📈 Beschikbaar</h3>
<div class="bedrag">€ 0,00</div>
</div>

</div>

<div class="maanden">

<h2>Maanden</h2>

<div class="grid">

<div class="maand">📅 Januari</div>
<div class="maand">📅 Februari</div>
<div class="maand">📅 Maart</div>
<div class="maand">📅 April</div>
<div class="maand">📅 Mei</div>
<div class="maand">📅 Juni</div>
<div class="maand">📅 Juli</div>
<div class="maand">📅 Augustus</div>
<div class="maand">📅 September</div>
<div class="maand">📅 Oktober</div>
<div class="maand">📅 November</div>
<div class="maand">📅 December</div>

</div>

</div>

<div class="footer">

<button>💵 Inkomsten</button>

<button>💳 Uitgaven</button>

<button>📊 Jaaroverzicht</button>

</div>

</div>

</body>
</html>
