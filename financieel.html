<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HS4S Financieel</title>

<style>

body {
    font-family: Georgia, serif;
    background: transparent;
    color: inherit;
    padding: 16px;
}

.finance-box {
    max-width: 900px;
    margin-left: 30px;
}

h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

input, select, button {

    font-family: Georgia, serif;

    padding: 8px;

    border: 1.5px solid rgba(120,120,120,0.8);

    border-radius: 4px;

    background: transparent;

    color: inherit;

}


button {

    cursor: pointer;

}


input {

    width: 120px;

}


.omschrijving {

    width: 180px;

}


.saldo {

    margin-bottom:20px;

    padding-bottom:10px;

    border-bottom:1px solid rgba(120,120,120,0.4);

}


table {

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}


th {

    text-align:left;

    border-bottom:2px solid rgba(120,120,120,0.5);

    padding:8px;

}


td {

    padding:8px;

    border-bottom:1px solid rgba(120,120,120,0.3);

}


.delete {

    cursor:pointer;

    border:1px solid rgba(120,120,120,0.8);

    padding:3px 7px;

    border-radius:4px;

}


.totalen {

    margin-top:20px;

    border-top:1px solid rgba(120,120,120,0.4);

    padding-top:10px;

}


</style>

</head>


<body>


<div class="finance-box">


<h2>💰 HS4S Financieel</h2>


<div class="saldo">

Beginsaldo:

<input id="beginSaldo" type="number" step="0.01">

<button onclick="opslaanSaldo()">Opslaan</button>


<br><br>


<b>Huidig saldo:</b>

€ <span id="saldo">0.00</span>


</div>



<h3>Nieuwe invoer</h3>


<input id="datum" type="date">

<input id="omschrijving" class="omschrijving" placeholder="Omschrijving">


<select id="categorie">

<option>Wonen</option>
<option>Voeding</option>
<option>Auto</option>
<option>Hobby</option>
<option>Reizen</option>
<option>Diversen</option>

</select>


<input id="inkomst" type="number" placeholder="Inkomst">

<input id="uitgave" type="number" placeholder="Uitgave">


<button onclick="toevoegen()">+</button>



<table>

<thead>

<tr>

<th>Datum</th>
<th>Omschrijving</th>
<th>Categorie</th>
<th>In</th>
<th>Uit</th>
<th>Saldo</th>
<th></th>

</tr>

</thead>


<tbody id="tabel">

</tbody>


</table>


<div class="totalen">

<b>Totaal inkomsten:</b>
€ <span id="totaalIn">0.00</span>

<br>

<b>Totaal uitgaven:</b>
€ <span id="totaalUit">0.00</span>


</div>


</div>



<script>


let gegevens = JSON.parse(
localStorage.getItem("HS4S_finance")
) || [];


let beginsaldo =
Number(localStorage.getItem("HS4S_beginsaldo")) || 0;



document.getElementById("beginSaldo").value = beginsaldo;



function opslaanSaldo(){

beginsaldo =
Number(document.getElementById("beginSaldo").value) || 0;


localStorage.setItem(
"HS4S_beginsaldo",
beginsaldo
);


tonen();

}



function toevoegen(){


let regel = {


datum: document.getElementById("datum").value,


omschrijving:
document.getElementById("omschrijving").value,


categorie:
document.getElementById("categorie").value,


inkomst:
Number(document.getElementById("inkomst").value) || 0,


uitgave:
Number(document.getElementById("uitgave").value) || 0


};



if(regel.omschrijving === ""){

alert("Vul een omschrijving in");

return;

}



gegevens.push(regel);



localStorage.setItem(

"HS4S_finance",

JSON.stringify(gegevens)

);



document.getElementById("omschrijving").value="";
document.getElementById("inkomst").value="";
document.getElementById("uitgave").value="";



tonen();


}




function tonen(){


let tabel =
document.getElementById("tabel");


tabel.innerHTML="";


let saldo = beginsaldo;

let totaalIn = 0;

let totaalUit = 0;



gegevens.forEach(function(regel,index){


saldo += regel.inkomst;

saldo -= regel.uitgave;


totaalIn += regel.inkomst;

totaalUit += regel.uitgave;



let rij =
document.createElement("tr");



rij.innerHTML =

`

<td>${regel.datum}</td>

<td>${regel.omschrijving}</td>

<td>${regel.categorie}</td>

<td>€ ${regel.inkomst.toFixed(2)}</td>

<td>€ ${regel.uitgave.toFixed(2)}</td>

<td>€ ${saldo.toFixed(2)}</td>

<td>
<span class="delete" onclick="verwijder(${index})">
🗑
</span>
</td>

`;



tabel.appendChild(rij);



});



document.getElementById("saldo").innerHTML =
saldo.toFixed(2);


document.getElementById("totaalIn").innerHTML =
totaalIn.toFixed(2);


document.getElementById("totaalUit").innerHTML =
totaalUit.toFixed(2);



}



function verwijder(index){


gegevens.splice(index,1);



localStorage.setItem(

"HS4S_finance",

JSON.stringify(gegevens)

);



tonen();


}



document.getElementById("datum").value =
new Date().toISOString().substring(0,10);



tonen();


</script>


</body>
</html>
